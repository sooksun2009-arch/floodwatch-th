# Render blueprint — creates the service with every setting already in place.
# In Render: New > Blueprint > pick this repo. Only DATABASE_URL is asked for.
#
# Free plan notes, both of which matter for how this app behaves:
#   * The service sleeps after 15 minutes with no traffic and takes about a
#     minute to wake. A cron ping every 10 minutes keeps it awake and fits
#     inside the 750 free instance-hours a month.
#   * There is no persistent disk, so uploaded photos are lost on every deploy.
#     Reports keep their text, depth and position; only the image goes.
services:
  - type: web
    name: floodwatch-th
    runtime: docker
    plan: free
    region: singapore          # closest Render region to Thailand
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render generates and stores this; it never appears in the repo.
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_USERNAME
        value: admin
      # Set this yourself in the dashboard before the first deploy finishes —
      # the seeder creates the admin account from it on first boot.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Postgres connection string from Neon (or any managed Postgres).
      - key: DATABASE_URL
        sync: false

      - key: SEED_DEMO_DATA
        value: "false"
      - key: REQUIRE_MODERATION
        value: "true"
      - key: ALLOW_ANONYMOUS_REPORTS
        value: "true"
      # A photo is the difference between a claim and evidence, and it is what
      # a passer-by can judge for themselves. Note the interaction with
      # AUTO_APPROVE_WITH_PHOTO below: with both on, every public report goes
      # straight to the map and the moderation queue stays empty by design.
      - key: REQUIRE_PHOTO
        value: "true"

      # A moderation queue with one person behind it goes dark exactly when it
      # matters — the night it floods. These let a report onto the map on its
      # own when it carries a photo, or when a second person reports the same
      # spot. Listed here so they can be switched off from the dashboard
      # without a redeploy.
      # Both off by the operator's decision, taken after Telegram alerts were
      # working: every public report waits for a human now. The code still
      # defaults these on, because a queue nobody is told about is worse than
      # an unreviewed pin — that is no longer the situation here, and turning
      # either back on is a dashboard edit away.
      - key: AUTO_APPROVE_WITH_PHOTO
        value: "false"
      - key: AUTO_APPROVE_CORROBORATED
        value: "false"
      - key: AUTO_APPROVE_RADIUS_M
        value: "300"
      - key: AUTO_APPROVE_WINDOW_HOURS
        value: "6"

      # Gauge stations: sync on boot, then keep fresh with a cron hitting
      # POST /api/stations/sync.
      - key: SYNC_STATIONS_ON_START
        value: "true"
      # Off since 2026-09-28. The Bangkok drainage site drops traffic from
      # large cloud networks — measured from Render, from Google Apps Script,
      # and from a machine in Thailand, which is the only one that works. The
      # sync failed on every cycle since the first deploy and logged an error
      # each time, which is noise about a thing that cannot be fixed from
      # here. The code is unchanged; flip this back if a relay ever runs
      # somewhere that can reach it.
      - key: SYNC_BMA_ON_START
        value: "false"

      # Shared secret for POST /api/stations/bma/ingest. The Bangkok drainage
      # site drops connections from outside Thailand, so this container cannot
      # fetch those gauges and a relay that can reach the site pushes them in.
      # Leave unset and the endpoint stays closed.
      - key: INGEST_TOKEN
        generateValue: true

      # Lets keepalive.gs download the nightly CSV backup (reports, visits,
      # tallies) into Google Drive without a moderator login. Unset = only a
      # signed-in moderator can export, from the admin page.
      - key: BACKUP_TOKEN
        generateValue: true

      # Longdo Weather: rain radar, short-range forecast and the traffic
      # cameras that currently have rain on them. Free key from
      # api.longdo.com/console, product "Longdo Weather", restricted to this
      # service's domain. Unset leaves every rain feature off.
      - key: LONGDO_API_KEY
        sync: false

      - key: GEOCODE_ENABLED
        value: "true"
      # Nominatim refuses requests whose User-Agent does not identify a real
      # operator. Point this at the live URL once Render assigns it.
      - key: HTTP_USER_AGENT
        sync: false

      # Free plan has no disk. Without a bucket, uploads live on the
      # container's own filesystem and every deploy deletes them.
      - key: UPLOAD_DIR
        value: /tmp/uploads

      # An S3-compatible bucket (Supabase Storage, Cloudflare R2, Backblaze B2)
      # makes photos outlive the container. Fill these in from the dashboard to
      # switch storage over; leave them blank and the app keeps using local
      # disk. Photos already on disk keep working either way.
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      # Must match the bucket's real region. R2 is the exception and takes
      # "auto"; elsewhere a wrong value fails every upload with a signature
      # error, because the region is part of what gets signed.
      - key: S3_REGION
        sync: false
